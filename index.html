<!DOCTYPE html>
<html>
<head>
  <title>File Usage Counter</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    table, th, td { border: 1px solid #ccc; }
    th, td { padding: 6px; text-align: left; }
  </style>
</head>
<body>

<h2>File Usage Counter</h2>
<p>Upload a CSV/TSV file with a column named <b>TargetFilename</b>.</p>

<input type="file" id="fileInput" />

<button id="exportBtn" disabled>Download Results</button>

<table id="resultTable">
  <thead>
    <tr><th>Filename</th><th>Count</th></tr>
  </thead>
  <tbody></tbody>
</table>

<script src="app.js"></script>
</body>
</html>
