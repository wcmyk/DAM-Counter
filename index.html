<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DAM File Usage Counter</title>

<style>
  body {
    margin: 0;
    font-family: "Inter", Arial, sans-serif;
    background: linear-gradient(135deg, #1e1e2f, #2a2a3d, #1b1b27);
    color: #f0f0f0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }

  .container {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(12px);
    border-radius: 16px;
    padding: 40px;
    max-width: 900px;
    width: 100%;
    box-shadow: 0 10px 35px rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.1);
  }

  h1 {
    text-align: center;
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 10px;
  }

  p.subtitle {
    text-align: center;
    font-size: 16px;
    margin-top: 0;
    opacity: 0.8;
  }

  /* File Input */
  .upload-area {
    text-align: center;
    margin: 30px 0;
  }

  #fileInput {
    display: none;
  }

  .upload-label {
    display: inline-block;
    padding: 12px 22px;
    background: #9146ff;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 600;
    transition: 0.2s ease;
  }

  .upload-label:hover {
    background: #7a35d6;
  }

  /* Export Button */
  #exportBtn {
    padding: 10px 18px;
    background: #1dbf73;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    color: #fff;
    font-size: 16px;
    margin-top: 20px;
    display: inline-block;
    transition: 0.2s ease;
  }

  #exportBtn:disabled {
    background: #3d3d3d;
    cursor: not-allowed;
  }

  #exportBtn:not(:disabled):hover {
    background: #16a15f;
  }

  /* Table */
  table {
    width: 100%;
    margin-top: 35px;
    border-collapse: collapse;
    font-size: 15px;
  }

  th, td {
    padding: 12px 10px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }

  th {
    background: rgba(255,255,255,0.08);
    text-align: left;
    font-size: 15px;
  }

  tr:hover td {
    background: rgba(255,255,255,0.04);
  }

</style>
</head>
<body>

<div class="container">
  <h1>DAM File Usage Counter</h1>
  <p class="subtitle">Upload a CSV/TSV file with a column named <b>Targetfilename</b>.</p>

  <div class="upload-area">
    <label class="upload-label" for="fileInput">📁 Select File</label>
    <input type="file" id="fileInput" accept=".csv,.tsv,.txt" />
  </div>

  <div style="text-align: center;">
    <button id="exportBtn" disabled>⬇️ Download Report</button>
  </div>

  <table id="resultTable">
    <thead>
      <tr><th>Filename</th><th>Count</th></tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script src="app.js"></script>
</body>
</html>
