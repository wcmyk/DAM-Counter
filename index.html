<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DAM File Usage Counter</title>

<style>
  /* Reset + full-page gradient without scroll flashes */
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow-x: hidden;
    background: #1b1b27;
  }

  body {
    font-family: "Inter", Arial, sans-serif;
    background: linear-gradient(135deg, #1e1e2f, #2a2a3d, #1b1b27) fixed;
    color: #f0f0f0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 20px;
    box-sizing: border-box;
  }

  /* Prevent white flash when scrolling beyond limits */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: inherit;
    z-index: -1;
  }

  /* Main card */
  .container {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(12px);
    border-radius: 16px;
    padding: 40px;
    max-width: 900px;
    width: 100%;
    box-shadow: 0 10px 35px rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.1);
    box-sizing: border-box;
  }

  h1 {
    text-align: center;
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 10px;
    letter-spacing: -0.5px;
  }

  p.subtitle {
    text-align: center;
    font-size: 16px;
    opacity: 0.8;
    margin-top: 0;
  }

  /* File Input Button */
  .upload-area {
    text-align: center;
    margin: 30px 0;
  }

  #fileInput { display: none; }

  .upload-label {
    display: inline-block;
    padding: 12px 22px;
    background: #9146ff;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 600;
    transition: 0.2s;
  }

  .upload-label:hover {
    background: #7a35d6;
  }

  /* Export button */
  #exportBtn {
    padding: 10px 18px;
    background: #1dbf73;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    color: white;
    font-size: 16px;
    margin-top: 20px;
    transition: 0.2s;
  }

  #exportBtn:disabled {
    background: #3d3d3d;
    cursor: not-allowed;
  }

  #exportBtn:not(:disabled):hover {
    background: #16a15f;
  }

  /* Table styling */
  table {
    width: 100%;
    margin-top: 35px;
    border-collapse: collapse;
    font-size: 15px;
  }

  th, td {
    padding: 12px 10px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }

  th {
    background: rgba(255,255,255,0.08);
    text-align: left;
  }

  tr:hover td {
    background: rgba(255,255,255,0.04);
  }
</style>
</head>

<body>

<div class="container">
  <h1>DAM File Usage Counter</h1>
  <p class="subtitle">Upload a CSV/TSV file with a column named <b>Targetfilename</b>.</p>

  <div class="upload-area">
    <label class="upload-label" for="fileInput">📁 Select File</label>
    <input type="file" id="fileInput" accept=".csv,.tsv,.txt" />
  </div>

  <div style="text-align:center;">
    <button id="exportBtn" disabled>⬇️ Download Report</button>
  </div>

  <table id="resultTable">
    <thead>
      <tr><th>Filename</th><th>Count</th></tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
/* ---------------- FILE INPUT HANDLER ---------------- */
document.getElementById("fileInput").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const text = await file.text();
  const rows = parseCSV(text);

  if (rows.length < 1) {
    alert("File appears empty.");
    return;
  }

  // Find Targetfilename column (case-insensitive)
  const header = rows[0];
  const colIndex = header.findIndex(
    h => typeof h === "string" && h.trim().toLowerCase() === "targetfilename"
  );

  if (colIndex === -1) {
    alert("Column 'Targetfilename' not found.");
    return;
  }

  // Count occurrences
  const counts = {};
  for (let i = 1; i < rows.length; i++) {
    const filename = (rows[i][colIndex] || "").trim();
    if (filename) counts[filename] = (counts[filename] || 0) + 1;
  }

  // Display results
  const tbody = document.querySelector("#resultTable tbody");
  tbody.innerHTML = "";

  for (const key in counts) {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${key}</td><td>${counts[key]}</td>`;
    tbody.appendChild(tr);
  }

  // Enable export button
  const exportBtn = document.getElementById("exportBtn");
  exportBtn.disabled = false;
  exportBtn.onclick = () => downloadCSV(counts);
});


/* ---------------- BASIC CSV / TSV PARSER ---------------- */
function parseCSV(str) {
  const rows = [];
  let row = [];
  let cur = "";
  let inside = false;

  for (let i = 0; i < str.length; i++) {
    const c = str[i];
    const next = str[i + 1];

    if (inside) {
      if (c === '"' && next === '"') { cur += '"'; i++; }
      else if (c === '"') inside = false;
      else cur += c;
    } else {
      if (c === '"') inside = true;
      else if (c === "," || c === "\t") { row.push(cur); cur = ""; }
      else if (c === "\n" || c === "\r") {
        if (cur.length || row.length) {
          row.push(cur); rows.push(row);
          row = []; cur = "";
        }
      } else cur += c;
    }
  }

  if (cur.length) row.push(cur);
  if (row.length) rows.push(row);

  return rows;
}


/* ---------------- CSV EXPORTER ---------------- */
function downloadCSV(counts) {
  let csv = "Filename,Count\n";
  for (const key in counts) {
    csv += `"${key}",${counts[key]}\n`;
  }

  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = url;
  a.download = "file_usage_report.csv";
  a.click();
}
</script>

</body>
</html>
